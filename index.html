<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>AlgoX Library - Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <ul class="background-shapes">
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
    </ul>
    <div class="container active">
        <div class="glass-card tilt-card" id="login-card">
            <h2>Welcome to AlgoX</h2>
            <p class="subtitle">Enter the Midnight Library</p>
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('login')">Login</button>
                <button class="tab-btn" onclick="switchTab('signup')">Sign Up</button>
            </div>
            <form onsubmit="handleAuth(event)">
                <div class="input-container">
                    <input type="text" id="userId" required placeholder=" ">
                    <label>User ID / Admin ID</label>
                    <div class="input-underline"></div>
                </div>
                <div class="input-container">
                    <input type="password" id="password" required placeholder=" ">
                    <label>Password</label>
                    <div class="input-underline"></div>
                </div>
                <button type="submit" id="auth-submit-btn" class="primary-btn creative-btn">Login</button>
            </form>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
